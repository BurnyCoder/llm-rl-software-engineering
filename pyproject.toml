[project]
name = "minibug-rl"
version = "0.1.0"
description = "Tiny, reproducible reinforcement learning from unit-test rewards for Python bug repair"
readme = "README.md"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
minibug-rl = "minibug_rl.cli:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
