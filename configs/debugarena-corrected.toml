# Global context: corrected executable adaptation of DebugArena's published sketch.
# Source: https://huggingface.co/BharathVikas/debugarena#training-code

[project]
name = "minibug-rl-debugarena-corrected"
data_file = "../data/minibug_tasks.json"
run_root = "../logs"
artifact_root = "../artifacts"
sandbox_image = "minibug-rl-sandbox:local"

[model]
base_model = "unsloth/qwen2.5-coder-0.5b-instruct"
revision = "main"
hub_model_id = "BurnyCoder/qwen2.5-coder-0.5b-swe-rl"
dtype = "bfloat16"
max_prompt_length = 512
max_completion_length = 256
backend = "unsloth"
load_in_4bit = true

[training]
seed = 42
# Thirty optimizer steps are approximately three passes over 36 tasks at effective batch four.
max_steps = 30
num_generations = 4
per_device_train_batch_size = 1
gradient_accumulation_steps = 4
learning_rate = 0.00001
temperature = 0.9
top_p = 0.95
save_steps = 10
lora_rank = 16
lora_alpha = 32
warmup_ratio = 0.05
max_grad_norm = 0.1

[evaluation]
sample_generations = 4
bootstrap_samples = 10000
